# @package _global_
# RxR evaluation uses the same 90-degree RGBD camera as R2R and training.
# nDTW uses the RxR guide reference paths. Results use a different camera setup
# from the standard 79-degree RxR benchmark.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - /habitat/task/measurements/oracle_success@habitat.task.measurements.oracle_success
  - /habitat/task/measurements/ndtw@habitat.task.measurements.ndtw
  - _self_

habitat:
  environment:
    max_episode_steps: 400
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 90
          depth_sensor:
            width: 640
            height: 480
            hfov: 90
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    requires_textures: true
    habitat_sim_v0:
      gpu_device_id: -1
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
        success_distance: 3.0
      path_length:
        type: PathLength
      oracle_navigation_error:
        type: OracleNavigationError
      ndtw:
        type: NDTW
        success_distance: 3.0
        gt_path: ${oc.env:VLN_DATA_ROOT,./data/vln_data}/eval_data/rxr/{split}/{split}_guide_gt.json.gz

      sdtw:
        type: SDTW

  dataset:
    # type: R2RVLN-v1
    split: val_unseen
    scenes_dir: ${oc.env:VLN_DATA_ROOT,./data/vln_data}/scene_datasets/v1/tasks
    data_path: ${oc.env:VLN_DATA_ROOT,./data/vln_data}/eval_data/rxr/{split}/{split}_guide_en.json.gz
